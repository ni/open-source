name: VIPM Dependency Update Test

on:
  pull_request:
    branches: [actions]
    paths:
      - scripts/apply-vipc/vipm.toml
      - scripts/update-vipm-dependencies/**
      - update-vipm-dependencies/action.yml
      - .github/workflows/vipm-dependency-update.yml
      - .github/workflows/reusable-vipm-update.yml
  workflow_dispatch:

jobs:
  update-vipm-dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-vipm-update.yml
    with:
      working_directory: scripts/apply-vipc
      labview_version: '2021'
      labview_bitness: '64'
      base_branch: actions
    secrets:
      VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
      VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
      VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
