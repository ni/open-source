name: Refresh VIPM Lock

on:
  pull_request:
    branches: [actions]
    paths:
      - scripts/apply-vipc/vipm.toml
      - .github/workflows/vipm-lock-refresh.yml
      - .github/workflows/reusable-vipm-lock.yml
      - refresh-vipm-lock/action.yml
      - scripts/refresh-vipm-lock/**
  push:
    branches: [actions]
    paths:
      - scripts/apply-vipc/vipm.toml
  workflow_dispatch:

jobs:
  # PRs only verify vipm.lock is in sync - read-only, no commits/PRs opened here.
  check-vipm-lock:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-vipm-lock.yml
    with:
      working_directory: scripts/apply-vipc
      labview_version: '2021'
      labview_bitness: '64'
      base_branch: actions
      check_only: true
    secrets:
      VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
      VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
      VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}

  # After merge (or manual dispatch), actually refresh vipm.lock and open a PR if it drifted.
  refresh-vipm-lock:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-vipm-lock.yml
    with:
      working_directory: scripts/apply-vipc
      labview_version: '2021'
      labview_bitness: '64'
      base_branch: actions
    secrets:
      VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
      VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
      VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}