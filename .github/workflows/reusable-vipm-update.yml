name: Reusable - Update VIPM Dependencies

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path (relative to the caller repo root) containing vipm.toml.'
        required: true
        type: string
      labview_version:
        description: 'LabVIEW version (YYYY) matching the [project] section of vipm.toml.'
        required: true
        type: string
      labview_bitness:
        description: '"32" or "64" bitness matching the [project] section of vipm.toml.'
        required: true
        type: string
      pr_branch:
        description: 'Branch name to push dependency updates to.'
        required: false
        type: string
        default: 'automation/vipm-dependency-update'
      pr_labels:
        description: 'Comma-separated labels to apply to the generated PR.'
        required: false
        type: string
        default: 'dependencies'
    secrets:
      VIPM_SERIAL_NUMBER:
        required: false
      VIPM_FULL_NAME:
        required: false
      VIPM_EMAIL:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vipm-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: ./update-vipm-dependencies
        with:
          working_directory: ${{ inputs.working_directory }}
          labview_version: ${{ inputs.labview_version }}
          labview_bitness: ${{ inputs.labview_bitness }}
          vipm_serial_number: ${{ secrets.VIPM_SERIAL_NUMBER }}
          vipm_full_name: ${{ secrets.VIPM_FULL_NAME }}
          vipm_email: ${{ secrets.VIPM_EMAIL }}
      # Opens/updates a PR only when vipm.toml or vipm.lock actually changed; no-ops otherwise.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore(deps): update VIPM package dependencies'
          title: 'chore(deps): update VIPM package dependencies'
          body: |
            Automated dependency update generated by `ni/open-source`'s reusable
            `reusable-vipm-update.yml` workflow.

            Review the `vipm.toml` / `vipm.lock` diff before merging.
          branch: ${{ inputs.pr_branch }}
          add-paths: |
            ${{ inputs.working_directory }}/vipm.toml
            ${{ inputs.working_directory }}/vipm.lock
          labels: ${{ inputs.pr_labels }}
