name: Reusable - Update VIPM Dependencies

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path (relative to the caller repo root) containing vipm.toml.'
        required: true
        type: string
      labview_version:
        description: 'LabVIEW version (YYYY) matching the [project] section of vipm.toml.'
        required: true
        type: string
      labview_bitness:
        description: '"32" or "64" bitness matching the [project] section of vipm.toml.'
        required: true
        type: string
      base_branch:
        description: 'Target branch for the generated pull request in the caller repository.'
        required: true
        type: string
      manifest_filename:
        description: 'Manifest filename (relative to working_directory) to read/update, e.g. "runner_dependencies.toml".'
        required: false
        type: string
        default: 'vipm.toml'
      lock_filename:
        description: 'Lock filename (relative to working_directory) to regenerate, e.g. "runner_dependencies.lock".'
        required: false
        type: string
        default: 'vipm.lock'
      include_dev_dependencies:
        description: 'If true, also bumps packages declared under [dev-dependencies] in addition to [dependencies].'
        required: false
        type: boolean
        default: true
      pr_branch:
        description: 'Branch name to push dependency updates to.'
        required: false
        type: string
        default: 'automation/vipm-dependency-update'
      pr_labels:
        description: 'Comma-separated labels to apply to the generated PR.'
        required: false
        type: string
        default: 'dependencies'
      commit_message:
        description: 'Commit subject for the dependency update and squash merge; include a caller requirement ID if required.'
        required: false
        type: string
        default: 'chore(deps): update VIPM package dependencies [REQ-044]'
      auto_merge:
        description: 'Request squash auto-merge for newly created PRs, subject to repository checks and approvals.'
        required: false
        type: boolean
        default: false
    secrets:
      PR_TOKEN:
        description: 'Optional GitHub App token or PAT for automatically triggering downstream CI; defaults to GITHUB_TOKEN.'
        required: false
      VIPM_SERIAL_NUMBER:
        required: false
      VIPM_FULL_NAME:
        required: false
      VIPM_EMAIL:
        required: false

  workflow_dispatch:
    inputs:
      working_directory:
        description: 'Path (relative to this repository root) containing vipm.toml.'
        required: true
        type: string
      labview_version:
        description: 'LabVIEW version (YYYY).'
        required: true
        type: string
      labview_bitness:
        description: '"32" or "64" bitness.'
        required: true
        type: string
      base_branch:
        description: "Optional target branch; defaults to this repository's default branch."
        required: false
        type: string
      manifest_filename:
        description: 'Manifest filename (relative to working_directory) to read/update, e.g. "runner_dependencies.toml".'
        required: false
        type: string
        default: 'vipm.toml'
      lock_filename:
        description: 'Lock filename (relative to working_directory) to regenerate, e.g. "runner_dependencies.lock".'
        required: false
        type: string
        default: 'vipm.lock'
      include_dev_dependencies:
        description: 'If true, also bumps packages declared under [dev-dependencies] in addition to [dependencies].'
        required: false
        type: boolean
        default: true
      pr_branch:
        description: 'Branch name to push dependency updates to.'
        required: false
        type: string
        default: 'automation/vipm-dependency-update'
      pr_labels:
        description: 'Comma-separated labels to apply to the generated PR.'
        required: false
        type: string
        default: 'dependencies'
      commit_message:
        description: 'Commit subject for the dependency update and squash merge; include a requirement ID if required.'
        required: false
        type: string
        default: 'chore(deps): update VIPM package dependencies [REQ-044]'
      auto_merge:
        description: 'Request squash auto-merge for newly created PRs. Requires repository auto-merge support.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vipm-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ inputs.base_branch || github.event.repository.default_branch }}
      - uses: ni/open-source/update-vipm-dependencies@actions
        with:
          working_directory: ${{ inputs.working_directory }}
          labview_version: ${{ inputs.labview_version }}
          labview_bitness: ${{ inputs.labview_bitness }}
          manifest_filename: ${{ inputs.manifest_filename }}
          lock_filename: ${{ inputs.lock_filename }}
          include_dev_dependencies: ${{ inputs.include_dev_dependencies }}
          vipm_serial_number: ${{ secrets.VIPM_SERIAL_NUMBER }}
          vipm_full_name: ${{ secrets.VIPM_FULL_NAME }}
          vipm_email: ${{ secrets.VIPM_EMAIL }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        id: dependency-pr
        with:
          token: ${{ secrets.PR_TOKEN || github.token }}
          commit-message: ${{ inputs.commit_message }}
          title: 'chore(deps): update VIPM package dependencies'
          body: |
            Automated dependency update generated by `ni/open-source`'s reusable
            `reusable-vipm-update.yml` workflow.

            Only `${{ inputs.manifest_filename }}` and `${{ inputs.lock_filename }}` changes are included.
            When enabled, auto-merge follows the caller repository's required checks and approvals.
          base: ${{ inputs.base_branch || github.event.repository.default_branch }}
          branch: ${{ inputs.pr_branch }}
          add-paths: |
            ${{ inputs.working_directory }}/${{ inputs.manifest_filename }}
            ${{ inputs.working_directory }}/${{ inputs.lock_filename }}
          labels: ${{ inputs.pr_labels }}
      - name: Request dependency PR auto-merge
        if: ${{ inputs.auto_merge && steps.dependency-pr.outputs.pull-request-number && steps.dependency-pr.outputs.pull-request-operation == 'created' }}
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          PR_URL: ${{ steps.dependency-pr.outputs.pull-request-url }}
          PR_HEAD_SHA: ${{ steps.dependency-pr.outputs.pull-request-head-sha }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          gh pr merge "$PR_URL" --auto --squash \
            --match-head-commit "$PR_HEAD_SHA" \
            --subject "$COMMIT_MESSAGE" --body ''