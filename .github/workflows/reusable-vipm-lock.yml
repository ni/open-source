name: Reusable - Refresh VIPM Lock

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path (relative to the caller repo root) containing vipm.toml.'
        required: true
        type: string
      labview_version:
        description: 'LabVIEW version (YYYY) matching the [project] section of vipm.toml.'
        required: true
        type: string
      labview_bitness:
        description: '"32" or "64" bitness matching the [project] section of vipm.toml.'
        required: true
        type: string
      check_only:
        description: 'If true, verifies an existing vipm.lock or generates the initial lock when absent.'
        required: false
        type: boolean
        default: false
      manifest_filename:
        description: 'Manifest filename (relative to working_directory) to read, e.g. "runner_dependencies.toml".'
        required: false
        type: string
        default: 'vipm.toml'
      lock_filename:
        description: 'Lock filename (relative to working_directory) to generate/check, e.g. "runner_dependencies.lock".'
        required: false
        type: string
        default: 'vipm.lock'
      base_branch:
        description: 'Target branch for the generated pull request.'
        required: true
        type: string
      pr_branch:
        description: 'Branch name to push vipm.lock updates to.'
        required: false
        type: string
        default: 'automation/vipm-lock-refresh'
      pr_labels:
        description: 'Comma-separated labels to apply to the generated PR.'
        required: false
        type: string
        default: 'dependencies'
    secrets:
      VIPM_SERIAL_NUMBER:
        required: false
      VIPM_FULL_NAME:
        required: false
      VIPM_EMAIL:
        required: false

jobs:
  refresh-vipm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: ni/open-source/refresh-vipm-lock@users/amrutha/vipm-custom-manifest-support
        with:
          working_directory: ${{ inputs.working_directory }}
          labview_version: ${{ inputs.labview_version }}
          labview_bitness: ${{ inputs.labview_bitness }}
          check_only: ${{ inputs.check_only }}
          manifest_filename: ${{ inputs.manifest_filename }}
          lock_filename: ${{ inputs.lock_filename }}
          vipm_serial_number: ${{ secrets.VIPM_SERIAL_NUMBER }}
          vipm_full_name: ${{ secrets.VIPM_FULL_NAME }}
          vipm_email: ${{ secrets.VIPM_EMAIL }}
      - name: Upload vipm.lock artifact
        if: ${{ inputs.check_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vipm-lock
          path: ${{ inputs.working_directory }}/${{ inputs.lock_filename }}
          if-no-files-found: error
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        if: ${{ !inputs.check_only }}
        with:
          commit-message: 'chore(deps): refresh ${{ inputs.lock_filename }}'
          title: 'chore(deps): refresh ${{ inputs.lock_filename }}'
          body: |
            Automated `${{ inputs.lock_filename }}` refresh generated by `ni/open-source`'s reusable
            `reusable-vipm-lock.yml` workflow.

            Review the `${{ inputs.lock_filename }}` diff before merging.
          base: ${{ inputs.base_branch }}
          branch: ${{ inputs.pr_branch }}
          add-paths: ${{ inputs.working_directory }}/${{ inputs.lock_filename }}
          labels: ${{ inputs.pr_labels }}