name: Reusable - Refresh VIPM Lock

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path (relative to the caller repo root) containing vipm.toml.'
        required: true
        type: string
      labview_version:
        description: 'LabVIEW version (YYYY) matching the [project] section of vipm.toml.'
        required: true
        type: string
      labview_bitness:
        description: '"32" or "64" bitness matching the [project] section of vipm.toml.'
        required: true
        type: string
      check_only:
        description: 'If true, verifies an existing vipm.lock or generates the initial lock when absent.'
        required: false
        type: boolean
        default: false
      base_branch:
        description: 'Target branch for the generated pull request.'
        required: true
        type: string
      pr_branch:
        description: 'Branch name to push vipm.lock updates to.'
        required: false
        type: string
        default: 'automation/vipm-lock-refresh'
      pr_labels:
        description: 'Comma-separated labels to apply to the generated PR.'
        required: false
        type: string
        default: 'dependencies'
    secrets:
      VIPM_SERIAL_NUMBER:
        required: false
      VIPM_FULL_NAME:
        required: false
      VIPM_EMAIL:
        required: false

jobs:
  refresh-vipm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: ./refresh-vipm-lock
        with:
          working_directory: ${{ inputs.working_directory }}
          labview_version: ${{ inputs.labview_version }}
          labview_bitness: ${{ inputs.labview_bitness }}
          check_only: ${{ inputs.check_only }}
          vipm_serial_number: ${{ secrets.VIPM_SERIAL_NUMBER }}
          vipm_full_name: ${{ secrets.VIPM_FULL_NAME }}
          vipm_email: ${{ secrets.VIPM_EMAIL }}
      - name: Upload vipm.lock artifact
        if: ${{ inputs.check_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vipm-lock
          path: ${{ inputs.working_directory }}/vipm.lock
          if-no-files-found: error
      # Opens/updates a PR only when vipm.lock actually changed; no-ops otherwise. Skipped for --check runs, which never write.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ !inputs.check_only }}
        with:
          commit-message: 'chore(deps): refresh vipm.lock'
          title: 'chore(deps): refresh vipm.lock'
          body: |
            Automated `vipm.lock` refresh generated by `ni/open-source`'s reusable
            `reusable-vipm-lock.yml` workflow.

            Review the `vipm.lock` diff before merging.
          base: ${{ inputs.base_branch }}
          branch: ${{ inputs.pr_branch }}
          add-paths: ${{ inputs.working_directory }}/vipm.lock
          labels: ${{ inputs.pr_labels }}
